<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central Texas Now — Local News for Waco, Temple &amp; Killeen</title>
<meta name="description" content="Local news for Waco, Temple, Killeen, Fort Cavazos and Belton — Central Texas Now.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ctn-styles.css">
<style>
  html,body{margin:0;padding:0;background:#f6f3ed;}
  #ctn-app{min-height:100vh;}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="ctn-data.js"></script>
<script src="image-slot.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="ctn-chrome.jsx"></script>
<script type="text/babel" src="ctn-pages.jsx"></script>
<script type="text/babel" src="ctn-tweaks.jsx"></script>
</head>
<body>
<div id="ctn-app"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = {
  "masthead": "block",
  "headlineFont": "sans",
  "density": "regular",
  "accent": "#b3122f",
  "dark": false
};

function darken(hex, f) {
  const h = hex.replace("#", "");
  const n = parseInt(h.length === 3 ? h.split("").map((c) => c + c).join("") : h, 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.round(r * (1 - f)); g = Math.round(g * (1 - f)); b = Math.round(b * (1 - f));
  return "#" + [r, g, b].map((v) => v.toString(16).padStart(2, "0")).join("");
}

function parseHash() {
  let raw = location.hash || "";
  if (raw.charAt(0) === "#") raw = raw.slice(1);
  if (raw.charAt(0) === "/") raw = raw.slice(1);
  const parts = raw.split("/").filter(Boolean);
  if (parts[0] === "section" && parts[1]) return { name: "section", slug: parts[1] };
  if (parts[0] === "article" && parts[1]) return { name: "article", id: parts[1] };
  return { name: "home" };
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [route, setRoute] = useState(parseHash());

  useEffect(() => {
    const onHash = () => setRoute(parseHash());
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  const go = (path) => {
    location.hash = "#/" + path;
    if (path === "home") window.scrollTo(0, 0);
  };

  const rootStyle = {
    "--accent": t.accent,
    "--accent-deep": darken(t.accent, 0.22),
    "--head-font": t.headlineFont === "serif" ? "var(--serif)" : "var(--sans)",
  };

  let page;
  if (route.name === "section") page = <SectionPage go={go} slug={route.slug} />;
  else if (route.name === "article") page = <ArticlePage go={go} id={route.id} />;
  else page = <HomePage go={go} />;

  return (
    <div
      className="ctn-root"
      style={rootStyle}
      data-dark={t.dark ? "true" : "false"}
      data-head={t.headlineFont}
      data-density={t.density}
    >
      <TopBar go={go} />
      <Masthead go={go} route={route} mastStyle={t.masthead} />
      {page}
      <Footer go={go} />
      <CTNTweaks t={t} setTweak={setTweak} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("ctn-app")).render(<App />);
</script>
</body>
</html>
